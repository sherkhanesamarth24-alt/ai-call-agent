<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Calling Agent</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 600px;
      padding: 40px;
      background: #101d30;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .robot {
      font-size: 65px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      color: #94a3b8;
    }

    button {
      padding: 14px 24px;
      margin: 20px 6px 0;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      background: #0891b2;
    }

    #stop {
      background: #dc2626;
    }

    #status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #0b1626;
      color: #22c55e;
    }

    #message {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #0b1626;
      color: #cbd5e1;
      min-height: 50px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="robot">🤖</div>

    <h1>AI Calling Agent</h1>

    <p>Your Personal AI Voice Assistant</p>

    <button onclick="startAssistant()">🎤 Start Assistant</button>

    <button id="stop" onclick="stopAssistant()">⛔ Stop</button>

    <div id="status">🟢 Ready</div>

    <div id="message">
      Click Start Assistant and speak.
    </div>

  </div>

  <script>

    let recognition;

    function startAssistant() {

      if (!("webkitSpeechRecognition" in window)) {
        document.getElementById("status").innerText =
          "❌ Speech recognition is not supported";
        return;
      }

      recognition = new webkitSpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      document.getElementById("status").innerText =
        "🎤 Listening...";

      document.getElementById("message").innerText =
        "Speak now...";

      recognition.start();

      recognition.onresult = async function(event) {

        const text =
          event.results[0][0].transcript;

        document.getElementById("message").innerText =
          "You: " + text;

        document.getElementById("status").innerText =
          "🤖 AI is thinking...";

        try {

          const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: text
            })

          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "AI response failed");
          }

          document.getElementById("message").innerText =
            "AI: " + data.reply;

          document.getElementById("status").innerText =
            "🔊 AI speaking...";

          const speech =
            new SpeechSynthesisUtterance(data.reply);

          speech.lang = "en-IN";
          speech.rate = 1;
          speech.pitch = 1;

          speech.onend = function() {

            document.getElementById("status").innerText =
              "🟢 Ready";

          };

          speechSynthesis.speak(speech);

        } catch (error) {

          console.error(error);

          document.getElementById("status").innerText =
            "❌ AI Error";

          document.getElementById("message").innerText =
            error.message;

        }

      };

      recognition.onerror = function(event) {

        document.getElementById("status").innerText =
          "❌ Microphone Error";

        document.getElementById("message").innerText =
          event.error;

      };

    }


    function stopAssistant() {

      if (recognition) {
        recognition.stop();
      }

      speechSynthesis.cancel();

      document.getElementById("status").innerText =
        "⛔ Stopped";

      document.getElementById("message").innerText =
        "Assistant stopped.";

    }

  </script>

</body>
</html>
